<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <style type = "text/css">
            ol li {list-style-type: lower-alpha;}
            ol{list-style-position: inside;}
            ul{list-style-position: outside;}
            li.kor {list-style-type: square;} 
            li.usa {list-style-type: circle;} 

            /* li.usa {list-style-image: url(.gif);} GIF 파일 사용하는게 적절함 */
            /* 그냥 li로만 쓰면 리스트 속성이 다 바뀜 ul 속성만 */
        </style>
        
    </head>
    <body>
        <p>순서가 없는 목록</p>
        <ul>
            <li class = "usa">첫번째</li>
            <li class= "kor">두번째</li>
            <li class= "usa">세번째</li>
        </ul>
        <p>순서가 있는 목록</p>
        <ol>
            <li>첫번째</li>
            <li>두번째</li>
            <li>세번째</li>
        </ol>
    </body>
</html>


<html>
    <head>
        <style type = "text/css">
            #book{width: 50%; min-width: 600px; border-spacing: 8px;}
            p {background-color: aqua ;}
            p:hover{background-color: yellow ; transition: background-color 3s ;}
            ul {background-color: brown;}
            li {background-color: blue;}
            td {background-color: chartreuse;}
        </style>

    </head>

    <body>
        
        <table border="1" id = "book">
            <tr>
                <th>과목</th>
                <th>책제목</th>
                <th>저자</th>
                <th>출판사</th>
            </tr>
            <tr>
                <th rowspan="2">웹프로그래밍</th>
                <td>HTML5</td>
                <td>임순범</td>
                <td>생능</td>
            </tr>
            <tr>
                <td>소셜미디어</td>
                <td>최윤철</td>
                <td>생능</td>
            </tr>
            <tr>
                <th>합계</th>
                <td colspan="3">2권</td>
            </tr>
        </table>

    </body>
</html>
